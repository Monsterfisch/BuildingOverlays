options:
- display: GroupBox
  category:
  - '{{qol}}'
  header: '{{large_gatehouse_group}}'
  text: '{{large_gatehouse_group_descr}}'
  hasHeader: true
  children:
  - url: building-overlays.large_gatehouse.enabled
    name: building-overlays-large-gatehouse-enabled
    text: '{{large_gatehouse_enabled_tooltip}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: false
    header: '{{large_gatehouse_enabled}}'
- display: GroupBox
  category:
  - '{{qol}}'
  header: '{{editor_group}}'
  text: '{{editor_group_descr}}'
  hasHeader: true
  children:
  - url: building-overlays.editor.enabled
    name: building-overlays-editor-enabled
    text: '{{editor_enabled_tooltip}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: false
    header: '{{editor_enabled}}'
- display: GroupBox
  category:
  - '{{qol}}'
  header: '{{mouse_group}}'
  text: '{{mouse_group_descr}}'
  hasHeader: true
  children:
  - url: building-overlays.mouse.hover_only
    name: building-overlays-mouse-hover-only
    text: '{{hover_only_tooltip}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: false
    header: '{{hover_only}}'
  - url: building-overlays.flags.on_edges
    name: building-overlays-flags-on-edges
    text: '{{flags_on_edges_tooltip}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: false
    header: '{{flags_on_edges}}'
- display: GroupBox
  category:
  - '{{bugfixes}}'
  header: '{{drawing_group}}'
  text: '{{drawing_group_descr}}'
  hasHeader: true
  children:
  - url: building-overlays.drawing.tile_by_tile
    name: building-overlays-drawing-tile-by-tile
    text: '{{tile_by_tile_tooltip}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: false
    header: '{{tile_by_tile}}'
  - url: building-overlays.drawing.hide_units
    name: building-overlays-drawing-hide-units
    text: '{{hide_units_tooltip}}'
    enabled: building-overlays.drawing.tile_by_tile
    display: UCP2Switch
    contents:
      type: boolean
      value: false
    header: '{{hide_units}}'
  - url: building-overlays.drawing.flag_layering
    name: building-overlays-drawing-flag-layering
    text: '{{flag_layering}}'
    tooltip: '{{flag_layering_tooltip}}'
    enabled: building-overlays.drawing.tile_by_tile
    display: Choice
    contents:
      type: choice
      value: inherit
      choices:
      - name: inherit
        text: '{{flag_layering_inherit}}'
      - name: native
        text: '{{flag_layering_native}}'
      - name: front
        text: '{{flag_layering_front}}'
      - name: rear_behind
        text: '{{flag_layering_rear_behind}}'
- display: GroupBox
  category:
  - '{{bugfixes}}'
  header: '{{keep_entrance_group}}'
  text: '{{keep_entrance_group_descr}}'
  hasHeader: true
  children:
  - url: building-overlays.keep_entrance.enabled
    name: building-overlays-keep-entrance-enabled
    text: '{{keep_entrance_enabled_tooltip}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: false
    header: '{{keep_entrance_enabled}}'
- display: GroupBox
  category:
  - '{{bugfixes}}'
  header: '{{flags_group}}'
  text: '{{flags_group_descr}}'
  hasHeader: true
  children:
  - url: building-overlays.flags.follow_turn
    name: building-overlays-flags-follow-turn
    text: '{{flags_follow_turn_tooltip}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: false
    header: '{{flags_follow_turn}}'
- url: building-overlays.large_gatehouse.swap_sides
  hidden: true
  name: building-overlays-large-gatehouse-swap-sides
  text: '{{large_gatehouse_swap_sides_tooltip}}'
  display: UCP2Switch
  contents:
    type: boolean
    value: false
  header: '{{large_gatehouse_swap_sides}}'
- url: building-overlays.drawing.flags_on_top
  hidden: true
  name: building-overlays-drawing-flags-on-top
  text: '{{flags_on_top_tooltip}}'
  display: UCP2Switch
  contents:
    type: boolean
    value: false
  header: '{{flags_on_top}}'
- url: building-overlays.drawing.back_flag_behind
  hidden: true
  name: building-overlays-drawing-back-flag-behind
  text: '{{back_flag_behind_tooltip}}'
  display: UCP2Switch
  contents:
    type: boolean
    value: false
  header: '{{back_flag_behind}}'
