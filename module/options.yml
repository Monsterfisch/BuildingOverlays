options:
- display: GroupBox
  category: [Building Overlays]
  header: '{{large_gatehouse_group}}'
  text: '{{large_gatehouse_group_descr}}'
  hasHeader: true
  children:
  - url: building-overlays.large_gatehouse.enabled
    name: building-overlays-large-gatehouse-enabled
    text: '{{large_gatehouse_enabled}}'
    tooltip: '{{large_gatehouse_enabled_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: building-overlays.large_gatehouse.swap_sides
    name: building-overlays-large-gatehouse-swap-sides
    text: '{{large_gatehouse_swap_sides}}'
    tooltip: '{{large_gatehouse_swap_sides_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: false

- display: GroupBox
  category: [Building Overlays]
  header: '{{editor_group}}'
  text: '{{editor_group_descr}}'
  hasHeader: true
  children:
  - url: building-overlays.editor.enabled
    name: building-overlays-editor-enabled
    text: '{{editor_enabled}}'
    tooltip: '{{editor_enabled_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: building-overlays.editor.key
    name: building-overlays-editor-key
    text: '{{editor_key}}'
    tooltip: '{{editor_key_tooltip}}'
    enabled: building-overlays.editor.enabled
    display: Choice
    contents:
      type: string
      value: letter_o
      choices:
      - name: letter_o
        text: 'Alt + O'
      - name: letter_a
        text: 'Alt + A'
      - name: letter_b
        text: 'Alt + B'
      - name: letter_f
        text: 'Alt + F'
      - name: letter_g
        text: 'Alt + G'
      - name: letter_i
        text: 'Alt + I'
      - name: letter_j
        text: 'Alt + J'
      - name: letter_l
        text: 'Alt + L'
      - name: letter_m
        text: 'Alt + M'
      - name: letter_n
        text: 'Alt + N'
      - name: letter_p
        text: 'Alt + P'
      - name: letter_s
        text: 'Alt + S'
      - name: letter_w
        text: 'Alt + W'
      - name: letter_y
        text: 'Alt + Y'
      - name: letter_z
        text: 'Alt + Z'
      - name: f1
        text: 'Alt + F1'
      - name: f2
        text: 'Alt + F2'
      - name: f3
        text: 'Alt + F3'
      - name: f4
        text: 'Alt + F4'
      - name: f5
        text: 'Alt + F5'
      - name: f6
        text: 'Alt + F6'
      - name: f7
        text: 'Alt + F7'
      - name: f8
        text: 'Alt + F8'
      - name: f9
        text: 'Alt + F9'
      - name: insert
