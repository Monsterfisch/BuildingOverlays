editor_group: ابزار لایه‌های پوششی
editor_group_descr: یک ساختمان را انتخاب کرده و روی یک لایهٔ پوششی در پنل آن کلیک کنید. با پیکان‌ها و دکمهٔ اندازهٔ گام تنظیمش کنید، سپس ذخیره را بزنید.
editor_enabled: ویرایش لایه‌های پوششی در پنل ساختمان
editor_enabled_tooltip: برای ویرایش، روی یک لایهٔ پوششی در پنل ساختمان انتخاب‌شده کلیک کنید.
mouse_group: نمایش لایه‌های پوششی
mouse_group_descr: انتخاب کنید لایه‌های پوششی چگونه نیروها را نمایان کنند و پرچم‌ها کجا قرار گیرند.
hover_only: نمایان کردن نیروها با بردن نشانگر
hover_only_tooltip: نشانگر را روی برج، دروازه یا قلعه ببرید تا نیروهای پشت لایهٔ پوششی دیده شوند.
drawing_group: ترسیم لایه‌های پوششی
drawing_group_descr: نحوهٔ ترسیم لایه‌های پوششی، نیروها و پرچم‌ها را کنترل کنید.
tile_by_tile: ترسیم لایه‌های پوششی پشت ساختمان‌های جلویی
tile_by_tile_tooltip: دیوارها و ساختمان‌های جلو می‌توانند لایه‌های پوششی پشت خود را بپوشانند.
hide_units: پنهان کردن نیروها زیر سقف‌ها
hide_units_tooltip: نیروهای زیر سقف‌ها پنهان می‌شوند. واحدهایی که از دروازه می‌گذرند نمایان می‌مانند.
flags_on_top: نمایش پرچم‌ها جلوی پوشش‌ها
flags_on_top_tooltip: پرچم‌های روی دژ مرکزی یا ساختمان‌های دیگر درست پس از پوشش همان ساختمان رسم می‌شوند تا پوشش خودش آن‌ها را پنهان نکند. دیوارها و ساختمان‌های جلویی همچنان پرچم را می‌پوشانند. نیازمند روشن بودن «پوشش دادن لایه‌ها توسط ساختمان‌های جلویی» است.
back_flag_behind: نگه داشتن پرچم عقبی پشت ساختمان
back_flag_behind_tooltip: پرچم گوشهٔ دورتر ساختمان مانند خود بازی پشت ساختمان و نیروهایش می‌ماند، نه جلوی پوشش‌ها. نیازمند «نمایش پرچم‌ها جلوی پوشش‌ها» است.
keep_entrance_group: ورودی دژ مرکزی
keep_entrance_group_descr: ناهماهنگی سایه‌روشن ورودی قلعه را برطرف می‌کند.
keep_entrance_enabled: هماهنگ کردن سایه‌روشن ورودی قلعه
keep_entrance_enabled_tooltip: بخش میانی ورودی قلعه همان سایهٔ برج‌های کنارش را می‌گیرد.
flags_group: پرچم‌ها
flags_group_descr: پرچم‌ها را هم‌تراز با ساختمان‌ها نگه می‌دارد.
flags_follow_turn: هم‌تراز نگه داشتن پرچم‌ها هنگام چرخش نقشه
flags_follow_turn_tooltip: پرچم‌ها هنگام چرخاندن نقشه در جای خود می‌مانند.
flags_on_edges: قرار دادن پرچم‌ها روی لبهٔ ساختمان‌ها
flags_on_edges_tooltip: میله‌های پرچم از میانهٔ کاشی به لبهٔ ساختمان منتقل می‌شوند.
qol: سهولت استفاده
bugfixes: رفع خطاها
