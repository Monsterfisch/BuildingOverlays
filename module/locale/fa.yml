large_gatehouse_group: دروازهٔ بزرگ
large_gatehouse_group_descr: تصویری که هنگام خالی بودن دروازهٔ بزرگ روی برج‌های آن کشیده می‌شود تا دیوارها به‌جای نمایش گذرگاه خالی، بسته به نظر برسند.
large_gatehouse_enabled: نمایش ظاهر بسته روی دروازه‌های بزرگ خالی
large_gatehouse_enabled_tooltip: دروازه‌های بزرگ بدون نیرو تصویری روی برج‌هایشان دریافت می‌کنند. به‌محض اینکه نیروها روی دروازه بروند تصویر محو می‌شود و نیروها مانند معمول دیده می‌شوند.
large_gatehouse_swap_sides: جابه‌جا کردن تصاویر چپ و راست
large_gatehouse_swap_sides_tooltip: اگر تصویری که برای دروازهٔ رو به پایین-چپ است روی دروازهٔ رو به پایین-راست نمایش داده می‌شود (یا برعکس)، این گزینه را روشن کنید.
editor_group: جابه‌جایی پوشش‌ها در بازی
editor_group_descr: ساختمانی را انتخاب کرده و روی یکی از پوشش‌های پنل آن کلیک کنید. با پیکان‌ها و اندازهٔ گام آن را تراز کنید. ذخیره، جابه‌جایی‌ها را در پوشهٔ محلی UCP ثبت می‌کند.
editor_enabled: نمایش ابزار پوشش در پنل ساختمان
editor_enabled_tooltip: "پوشش‌های ساختمان انتخاب‌شده را در پنل آن فهرست می‌کند: با پیکان‌ها جابه‌جا می‌شوند و Save مکانشان را نگه می‌دارد."
mouse_group: دیدن نیروها روی برج‌ها، دروازه‌ها و دژهای مرکزی
mouse_group_descr: به‌طور عادی پوشش یک ساختمان هنگام ایستادن نیروها روی آن ناپدید می‌شود.
hover_only: پنهان کردن پوشش‌ها فقط هنگام قرار گرفتن ماوس روی ساختمان
hover_only_tooltip: |-
  برج‌ها، دروازه‌ها و دژهای مرکزی حتی با وجود نیروها دیوار و کنگره‌هایشان را نمایش می‌دهند تا نیروها پشت کنگره‌ها دیده شوند. ماوس را روی ساختمان ببرید تا ببینید چه کسانی آن بالا هستند. شامل پوشش‌های این ماژول و سقف برج‌های بازی است؛ کنگرهٔ برج‌ها و دیگر پوشش‌های بازی قوانین خود بازی را حفظ می‌کنند.
drawing_group: ترسیم
drawing_group_descr: نحوهٔ ترسیم تصاویر پوشش روی نقشه.
tile_by_tile: پوشش دادن لایه‌ها توسط ساختمان‌های جلویی
tile_by_tile_tooltip: |-
  بازی پوشش‌هایش را یکجا در گوشهٔ جلویی ساختمان رسم می‌کند و باعث می‌شود از میان برج‌ها و دیوارهای کناری دیده شوند. با روشن بودن این گزینه، تصاویر این ماژول و پوشش‌های خود بازی (پرچم‌ها، پویانمایی‌ها، نوک برج‌ها…) در نوارهای باریک همراه خانه‌های ساختمان رسم می‌شوند تا هر چیز جلویی آن‌ها را درست بپوشاند.
hide_units: پنهان کردن واحدها زیر سقف‌ها
hide_units_tooltip: نیروهای ایستاده روی برج، دروازه یا دژ مرکزی تا وقتی سقفش نمایان است رسم نمی‌شوند تا بخشی از آن‌ها از سقف بیرون نزند. نیروهای در حال عبور از دروازه همچنان دیده می‌شوند. نیازمند روشن بودن «پوشش دادن لایه‌ها توسط ساختمان‌های جلویی» است.
flags_on_top: نمایش پرچم‌ها جلوی پوشش‌ها
flags_on_top_tooltip: پرچم‌های روی دژ مرکزی یا ساختمان‌های دیگر درست پس از پوشش همان ساختمان رسم می‌شوند تا پوشش خودش آن‌ها را پنهان نکند. دیوارها و ساختمان‌های جلویی همچنان پرچم را می‌پوشانند. نیازمند روشن بودن «پوشش دادن لایه‌ها توسط ساختمان‌های جلویی» است.
back_flag_behind: نگه داشتن پرچم عقبی پشت ساختمان
back_flag_behind_tooltip: پرچم گوشهٔ دورتر ساختمان مانند خود بازی پشت ساختمان و نیروهایش می‌ماند، نه جلوی پوشش‌ها. نیازمند «نمایش پرچم‌ها جلوی پوشش‌ها» است.
keep_entrance_group: ورودی دژ مرکزی
keep_entrance_group_descr: یک اشکال گرافیکی بازی در ورودی جلوی دژ مرکزی را برطرف می‌کند.
keep_entrance_enabled: ترسیم درست بخش میانی ورودی دژ مرکزی
keep_entrance_enabled_tooltip: |-
  در دو جهت از چهار جهت چرخش دژ مرکزی، بازی بخش میانی ورودی را با نورپردازی اشتباه رسم می‌کند: ستون روشن میان برج‌های سایه‌دار یا ستون تیره در طاق روشن. با این گزینه میانه با دو برج کناری هماهنگ می‌شود و پس از لحظه‌ای یا چرخش نقشه اعمال می‌گردد.
flags_group: پرچم‌ها
flags_group_descr: نحوهٔ قرارگیری پرچم‌ها روی ساختمان‌ها را اصلاح می‌کند.
flags_follow_turn: ثابت ماندن جای پرچم‌ها هنگام چرخش نقشه
flags_follow_turn_tooltip: بازی جای میلهٔ پرچم روی صفحه را فقط هنگام نصب و برای همان زاویهٔ دید محاسبه می‌کند و پس از چرخش نقشه چند پیکسل از لبهٔ ساختمان فاصله می‌گیرد. با این گزینه همراه هر چرخش نقشه تنظیم می‌شود.
flags_on_edges: قرار دادن پرچم‌ها روی لبهٔ ساختمان
flags_on_edges_tooltip: بازی پرچم را وسط خانه قرار می‌دهد و پرچم گوشهٔ ساختمان نیم‌خانه به داخل می‌افتد. با این گزینه میلهٔ پرچم در همهٔ زاویه‌ها روی لبه (و در خانهٔ گوشه‌ای دقیقاً روی گوشه) قرار می‌گیرد.
qol: سهولت استفاده
bugfixes: رفع خطاها
