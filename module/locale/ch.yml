large_gatehouse_group: 大型城门楼
large_gatehouse_group_descr: 当大型城门楼上无人驻守时，在其两侧塔楼上方绘制覆盖贴图，使城墙呈现封闭外观，而不是露出空荡的城垛通道。
large_gatehouse_enabled: 为空置的大型城门楼绘制封闭外观
large_gatehouse_enabled_tooltip: 无人驻守的大型城门楼会在塔楼上方显示覆盖贴图；一旦有部队登上城门楼，贴图就会隐藏并照常显示部队。
large_gatehouse_swap_sides: 互换左右两侧贴图
large_gatehouse_swap_sides_tooltip: 如果朝向左下方的城门楼显示了朝向右下方的贴图（或相反），请启用此项。
editor_group: 在游戏中移动覆盖层
editor_group_descr: 选中一座建筑并在其面板中点击某个覆盖层，使用箭头与步长控件对齐位置。点击保存会将偏移写入本地 UCP 目录。
editor_enabled: 在建筑面板中显示覆盖层工具
editor_enabled_tooltip: |-
  选中任意建筑，其面板会列出所有覆盖层——包括本模块的贴图和游戏自带的绘制图层（「Game #n」）。点击任意一项即可选中（本模块贴图无论是否站人都会带品红边框显示），再用蓝色箭头调整位置（Step 在 1、5 和 20 像素间切换）。再次点击已选项即可结束调整。Save 会将所有覆盖层坐标写入模块目录的 calibration.json，可直接作为 overlays.json 放入插件。
mouse_group: 查看塔楼、城门楼与主堡上的部队
mouse_group_descr: 默认情况下，只要建筑上有部队站立，该建筑的覆盖层就会隐藏。
hover_only: 仅当鼠标悬停在建筑上时隐藏覆盖层
hover_only_tooltip: |-
  即使塔楼、城门楼和主堡上有部队驻守，仍保留绘制城墙与垛口，让部队看起来站在城垛后方；将鼠标移到建筑上即可看清上方部队。此设置适用于本模块的覆盖层及游戏自带塔楼屋顶，塔楼垛口和其他游戏覆盖层仍遵循原版规则。
drawing_group: 绘制方式
drawing_group_descr: 控制覆盖层贴图在地图上的绘制方式。
tile_by_tile: 允许前方建筑遮挡覆盖层
tile_by_tile_tooltip: |-
  原版游戏会把覆盖层整块绘制在建筑前端角落，导致其穿透紧邻前方的塔楼与城墙显示。开启后，本模块贴图以及每座建筑的游戏自带覆盖层（旗帜、动画、塔顶等）会随建筑地块逐条带状绘制，让前方建筑正确遮挡它们。
hide_units: 隐藏屋顶下方的单位
hide_units_tooltip: 当塔楼、城门楼或主堡显示屋顶时，不绘制站在其上的部队，避免身体穿模露出屋顶；穿过城门的单位仍可见。需开启「允许前方建筑遮挡覆盖层」。
flags_on_top: 在覆盖层前方显示旗帜
flags_on_top_tooltip: 位于主堡或其他建筑上的旗帜紧随该建筑覆盖层之后绘制，避免被自身覆盖层挡住；前方的城墙与建筑仍照常遮挡旗帜。需开启「允许前方建筑遮挡覆盖层」。
back_flag_behind: 将后方旗帜保持在建筑后方
back_flag_behind_tooltip: 建筑远角处的旗帜继续按原版规则绘制在建筑与上方单位之后，而不是覆盖层之前。需开启「在覆盖层前方显示旗帜」。
keep_entrance_group: 主堡入口
keep_entrance_group_descr: 修复主堡前方入口处的游戏贴图光照错误。
keep_entrance_enabled: 正确绘制主堡入口中部
keep_entrance_enabled_tooltip: 在四个视角中的两个方向上，游戏会用错误光照绘制主堡入口中部——阴影双塔间出现明亮立柱，或明亮拱门中出现暗色立柱。开启后中部与两侧塔楼光照一致，片刻或旋转地图后立即生效。
flags_group: 旗帜
flags_group_descr: 修复游戏在建筑上放置旗帜的位置问题。
flags_follow_turn: 旋转地图时保持旗帜位置正确
flags_follow_turn_tooltip: 原版游戏只在插旗时按当时视角计算旗杆屏幕位置，旋转地图后旗杆会偏离建筑边缘数像素。开启后旗杆会随每次地图旋转同步对齐。
flags_on_edges: 将旗帜移至建筑边缘
flags_on_edges_tooltip: 原版游戏将旗帜放在地块正中，使建筑转角旗帜向内缩进半格。开启后旗杆在任意视角下都会对齐建筑边缘（转角处对齐墙角）。
qol: 体验优化
bugfixes: 错误修复
misc: 其他
