large_gatehouse_group: 大型城门楼
large_gatehouse_group_descr: 大城门楼上无人站立时显示顶盖。
large_gatehouse_enabled: 无人时大城门楼显示封闭外观
large_gatehouse_enabled_tooltip: 有部队踏上城门楼时顶盖自动抬起。
large_gatehouse_swap_sides: 互换左右两侧贴图
large_gatehouse_swap_sides_tooltip: 如果朝向左下方的城门楼显示了朝向右下方的贴图（或相反），请启用此项。
editor_group: 叠加层工具
editor_group_descr: 选中建筑后点击其面板中的叠加层，用方向键和步长按钮微调，再点击保存。
editor_enabled: 在建筑面板中编辑叠加层
editor_enabled_tooltip: 点击已选建筑面板中的叠加层即可编辑。
mouse_group: 叠加层显示
mouse_group_descr: 选择叠加层如何显露部队以及旗帜的摆放位置。
hover_only: 鼠标悬停时显露部队
hover_only_tooltip: 将鼠标移到塔楼、城门楼或主堡上，显露被叠加层遮挡的部队。
drawing_group: 叠加层绘制
drawing_group_descr: 控制叠加层、部队和旗帜的绘制方式。
tile_by_tile: 在前景建筑后方绘制叠加层
tile_by_tile_tooltip: 前方的城墙和建筑可正常遮挡后方的叠加层。
hide_units: 隐藏屋顶下的部队
hide_units_tooltip: 屋顶下的部队会被隐藏；穿过城门的单位仍然可见。
flags_on_top: 在覆盖层前方显示旗帜
flags_on_top_tooltip: 位于主堡或其他建筑上的旗帜紧随该建筑覆盖层之后绘制，避免被自身覆盖层挡住；前方的城墙与建筑仍照常遮挡旗帜。需开启「允许前方建筑遮挡覆盖层」。
back_flag_behind: 将后方旗帜保持在建筑后方
back_flag_behind_tooltip: 建筑远角处的旗帜继续按原版规则绘制在建筑与上方单位之后，而不是覆盖层之前。需开启「在覆盖层前方显示旗帜」。
keep_entrance_group: 主堡入口
keep_entrance_group_descr: 修正主堡入口处的明暗不一致。
keep_entrance_enabled: 统一主堡入口明暗
keep_entrance_enabled_tooltip: 主堡入口中央采用与两侧塔楼一致的明暗色调。
flags_group: 旗帜
flags_group_descr: 让旗帜与建筑保持对齐。
flags_follow_turn: 旋转地图时保持旗帜对齐
flags_follow_turn_tooltip: 旋转地图时旗帜保持原位不偏移。
flags_on_edges: 将旗帜置于建筑边缘
flags_on_edges_tooltip: 旗杆从地块中央移至建筑边缘。
qol: 便利性改进
bugfixes: 错误修复
