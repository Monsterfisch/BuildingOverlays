large_gatehouse_group: Large gatehouse
large_gatehouse_group_descr: A cover appears while nobody is standing on the gatehouse.
large_gatehouse_enabled: Closed look for empty large gatehouses
large_gatehouse_enabled_tooltip: The cover lifts when troops step onto the gatehouse.
large_gatehouse_swap_sides: Swap the left and right pictures
large_gatehouse_swap_sides_tooltip: 'Use this if the picture meant for a gatehouse looking to the lower left shows
  up on one

  looking to the lower right (and the other way round).

  '
editor_group: Overlay tool
editor_group_descr: Select a building and click an overlay in its panel. Adjust it with the arrows and step-size
  button, then click Save.
editor_enabled: Edit overlays in the building panel
editor_enabled_tooltip: Click an overlay in the selected building's panel to edit it.
mouse_group: Overlay display
mouse_group_descr: Choose how overlays reveal troops and where flags sit.
hover_only: Reveal troops on hover
hover_only_tooltip: Point at a tower, gatehouse or keep to reveal troops behind its overlay.
drawing_group: Overlay drawing
drawing_group_descr: Control how overlays, troops and flags are drawn.
tile_by_tile: Draw overlays behind foreground buildings
tile_by_tile_tooltip: Walls and buildings in front can cover the overlays behind them.
hide_units: Hide troops under roofs
hide_units_tooltip: Troops under roofs are hidden. Units passing through gates stay visible.
flags_on_top: Show flags in front of the overlays
flags_on_top_tooltip: 'Flags standing on a keep or another building are drawn right after that building''s overlay

  pictures, so its own overlay never hides any part of them. Walls and buildings in front of

  it still cover the flag as usual. Works together with "Let buildings in front cover the

  overlays" (needs it on).

  '
back_flag_behind: Keep the flag at the back behind the building
back_flag_behind_tooltip: 'The flag on a building''s far corner stays behind the building and the units on it, where
  the

  game draws it, instead of in front of the overlays. Needs "Show flags in front of the

  overlays".

  '
keep_entrance_group: Keep entrance
keep_entrance_group_descr: Corrects a shading mismatch at the keep entrance.
keep_entrance_enabled: Match keep entrance shading
keep_entrance_enabled_tooltip: The middle of the keep entrance uses the same shade as the towers beside it.
flags_group: Flags
flags_group_descr: Keep flags aligned with buildings.
flags_follow_turn: Keep flags aligned as the map turns
flags_follow_turn_tooltip: Flags stay in position when you rotate the map.
flags_on_edges: Place flags on building edges
flags_on_edges_tooltip: Flagpoles move from the middle of their tile to the building edge.
qol: Quality of Life
bugfixes: Bugfixes
