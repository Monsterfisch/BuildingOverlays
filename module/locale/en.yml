large_gatehouse_group: Large gatehouse
large_gatehouse_group_descr: |
  A picture drawn over the towers of a large gatehouse while nobody is standing on it, so
  the walls look closed up instead of showing the empty walkway.
large_gatehouse_enabled: Draw the closed-up look on empty large gatehouses
large_gatehouse_enabled_tooltip: |
  Large gatehouses with no troops on them get a picture over their towers. As soon as
  troops step onto the gatehouse the picture goes away and they are shown as usual.
large_gatehouse_swap_sides: Swap the left and right pictures
large_gatehouse_swap_sides_tooltip: |
  Use this if the picture meant for a gatehouse looking to the lower left shows up on one
  looking to the lower right (and the other way round).

editor_group: Moving overlays in the game
editor_group_descr: |
  A tool to line overlay pictures up by eye and save the result.
editor_enabled: Show the overlay tool in the building panel
editor_enabled_tooltip: |
  Select any building: its panel lists its overlays - this module's and the game's own
  pictures it is drawn with ("Game #n"). Click one to pick it - one of this module's is then
  shown on that building whatever stands there, with a magenta frame - and use the
  blue arrows to move it (Step switches between 1, 5 and 20 pixels). Click the picked
  overlay again to stop. Save writes every overlay's spot to calibration.lua in the module
  folder, ready to go into a plugin as overlays.lua.

mouse_group: Seeing troops on towers, gatehouses and keeps
mouse_group_descr: |
  Normally a building's overlay goes away while troops stand on it.
hover_only: Only hide the overlays while the mouse is on the building
hover_only_tooltip: |
  Towers, gatehouses and keeps keep their walls and crenellations drawn even with troops on
  them, so the troops stand behind the battlements. Point the mouse at the building to see
  who is up there. Covers this module's overlays and the roofs of the game's towers. A tower's crenellations
  and every other game overlay keep the game's own rules.

drawing_group: Drawing
drawing_group_descr: |
  How this module's overlay pictures are put on the map.
tile_by_tile: Let buildings in front cover the overlays
tile_by_tile_tooltip: |
  The game draws its overlays in one piece at a building's front corner, so they show through
  towers and walls standing right next to the building. With this on, this module's pictures
  are drawn in narrow strips together with the building's own tiles, and anything standing in
  front covers them properly. The game's own overlays are not changed (yet).
