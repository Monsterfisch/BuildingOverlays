large_gatehouse_group: Large gatehouse
large_gatehouse_group_descr: |
  A picture drawn over the towers of a large gatehouse while nobody is standing on it, so
  the walls look closed up instead of showing the empty walkway.
large_gatehouse_enabled: Draw the closed-up look on empty large gatehouses
large_gatehouse_enabled_tooltip: |
  Large gatehouses with no troops on them get a picture over their towers. As soon as
  troops step onto the gatehouse the picture goes away and they are shown as usual.
large_gatehouse_swap_sides: Swap the left and right pictures
large_gatehouse_swap_sides_tooltip: |
  Use this if the picture meant for a gatehouse looking to the lower left shows up on one
  looking to the lower right (and the other way round).

editor_group: Moving overlays in the game
editor_group_descr: |
  A tool to line overlay pictures up by eye and save the result.
editor_enabled: Allow the line-up tool
editor_enabled_tooltip: |
  Turns the tool on or off completely. With it off, the key below does nothing.
editor_key: Key that switches the tool on and off
editor_key_tooltip: |
  Hold Alt and press this key in a game to start moving overlays. The picked overlay gets a
  magenta frame and is shown whatever is standing on the building, with blue arrow buttons
  next to it: click one to move the picture a pixel, hold it to keep moving. Alt + PageUp /
  PageDown picks another overlay, Alt + End saves every overlay to calibration.lua in the
  module folder (ready to go into a plugin as overlays.lua). Press the key again to stop.