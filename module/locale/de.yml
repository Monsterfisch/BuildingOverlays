large_gatehouse_group: Großes Torhaus
large_gatehouse_group_descr: Ein Bild, das über die Türme eines großen Torhauses gezeichnet wird, solange niemand darauf steht, sodass die Mauern geschlossen wirken statt den leeren Wehrgang zu zeigen.
large_gatehouse_enabled: Geschlossene Optik bei leeren großen Torhäusern zeichnen
large_gatehouse_enabled_tooltip: Leere große Torhäuser erhalten ein Bild über ihren Türmen. Sobald Truppen das Torhaus betreten, verschwindet das Bild und sie werden wie gewohnt angezeigt.
large_gatehouse_swap_sides: Linkes und rechtes Bild tauschen
large_gatehouse_swap_sides_tooltip: Verwende dies, wenn das Bild für ein nach links unten zeigendes Torhaus auf einem nach rechts unten zeigenden Torhaus erscheint (und umgekehrt).
editor_group: Overlays im Spiel verschieben
editor_group_descr: Wähle ein Gebäude und klicke im Gebäudefenster auf ein Overlay. Nutze die Pfeile und die Schrittweite zum Ausrichten. Speichern schreibt die Versätze in den lokalen UCP-Ordner.
editor_enabled: Overlay-Werkzeug im Gebäudefenster anzeigen
editor_enabled_tooltip: |-
  Wähle ein beliebiges Gebäude: Sein Fenster listet seine Overlays auf – die dieses Moduls sowie die eigenen Grafiken des Spiels („Game #n“). Klicke eines an, um es auszuwählen – ein Overlay dieses Moduls wird dann unabhängig von der Belegung mit einem magentafarbenen Rahmen auf dem Gebäude angezeigt – und verschiebe es mit den blauen Pfeilen (Step wechselt zwischen 1, 5 und 20 Pixeln). Klicke das gewählte Overlay erneut an, um zu beenden. Save schreibt die Position jedes Overlays in eine Datei im ucp-Ordner des Spiels, im Format der overlays.lua eines Plugins.
mouse_group: Truppen auf Türmen, Torhäusern und Bergfrieden sehen
mouse_group_descr: Normalerweise wird das Overlay eines Gebäudes ausgeblendet, solange Truppen darauf stehen.
hover_only: Overlays nur ausblenden, während der Mauszeiger auf dem Gebäude liegt
hover_only_tooltip: |-
  Türme, Torhäuser und Bergfriede behalten ihre gezeichneten Mauern und Zinnen auch mit Truppen darauf, sodass die Truppen hinter den Zinnen stehen. Fahre mit der Maus über das Gebäude, um zu sehen, wer oben steht. Gilt für die Overlays dieses Moduls und die Dächer der Spieltürme; Turmzinnen und alle übrigen Spiel-Overlays behalten die Regeln des Spiels.
drawing_group: Darstellung
drawing_group_descr: Wie Overlay-Grafiken auf der Karte gezeichnet werden.
tile_by_tile: Gebäude davor verdecken die Overlays
tile_by_tile_tooltip: |-
  Das Spiel zeichnet seine Overlays in einem Stück an der vorderen Ecke eines Gebäudes, sodass sie durch direkt danebenstehende Türme und Mauern hindurchscheinen. Mit dieser Option werden die Grafiken dieses Moduls in schmalen Streifen zusammen mit den eigenen Feldern des Gebäudes gezeichnet, sodass alles davor sie korrekt verdeckt. Dasselbe gilt für die eigenen Overlay-Grafiken des Spiels auf jedem Gebäude (Flaggen, Animationen, Turmdächer …).
hide_units: Einheiten unter Dächern verbergen
hide_units_tooltip: Truppen auf einem Turm, Torhaus oder Bergfried werden nicht gezeichnet, solange das Dach sichtbar ist, damit kein Teil von ihnen durch das Dach ragt. Einheiten, die durch ein Torhaus marschieren, bleiben sichtbar. Erfordert „Gebäude davor verdecken die Overlays“.
flags_on_top: Flaggen vor den Overlays anzeigen
flags_on_top_tooltip: Flaggen auf einem Bergfried oder einem anderen Gebäude werden direkt nach dessen Overlays gezeichnet, sodass das eigene Overlay keinen Teil davon verdeckt. Mauern und Gebäude davor verdecken die Flagge weiterhin wie gewohnt. Erfordert „Gebäude davor verdecken die Overlays“.
back_flag_behind: Hintere Flagge hinter dem Gebäude belassen
back_flag_behind_tooltip: Die Flagge an der hinteren Ecke eines Gebäudes bleibt hinter dem Gebäude und den Einheiten darauf, wo das Spiel sie zeichnet, statt vor den Overlays. Erfordert „Flaggen vor den Overlays anzeigen“.
keep_entrance_group: Bergfried-Eingang
keep_entrance_group_descr: Behebt einen Grafikfehler des Spiels am Eingang vor einem Bergfried.
keep_entrance_enabled: Mitte des Bergfried-Eingangs korrekt zeichnen
keep_entrance_enabled_tooltip: Bei Bergfrieden in zwei der vier Kartenausrichtungen zeichnet das Spiel die Mitte des Eingangs im falschen Licht – ein heller Pfeiler zwischen schattigen Türmen oder ein dunkler in einem hellen Torbogen. Mit dieser Option passt die Mitte zu den beiden Türmen daneben. Wirkt nach einem Augenblick oder beim Drehen der Karte.
flags_group: Flaggen
flags_group_descr: Behebt, wie das Spiel Flaggen auf Gebäuden platziert.
flags_follow_turn: Flaggen beim Drehen der Karte an Ort und Stelle halten
flags_follow_turn_tooltip: Das Spiel berechnet die Bildschirmposition eines Fahnenmasts nur beim Aufstellen der Flagge für die damalige Ansicht. Nach dem Drehen der Karte stehen die Masten einige Pixel neben der Gebäudekante. Mit dieser Option wandern sie bei jeder Kartendrehung mit.
flags_on_edges: Flaggen an die Gebäudekante setzen
flags_on_edges_tooltip: Das Spiel stellt eine Flagge in die Mitte ihres Feldes, sodass eine Flagge an einer Gebäudeecke ein halbes Feld eingerückt steht. Mit dieser Option rückt der Mast in jeder Ansicht an die Kante (auf Eckfeldern genau auf die Ecke).
qol: Komfortfunktionen
bugfixes: Fehlerkorrekturen
misc: Sonstiges
