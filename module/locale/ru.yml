large_gatehouse_group: Большие ворота
large_gatehouse_group_descr: Накладка поверх башен больших ворот, пока на них никого нет, благодаря чему стены выглядят закрытыми вместо пустой площадки.
large_gatehouse_enabled: Рисовать закрытый вид на пустых больших воротах
large_gatehouse_enabled_tooltip: Пустые большие ворота получают накладку поверх башен. Как только войска ступают на ворота, накладка исчезает, и бойцы отображаются как обычно.
large_gatehouse_swap_sides: Поменять местами левую и правую накладки
large_gatehouse_swap_sides_tooltip: Включите, если накладка для ворот, обращённых влево-вниз, показывается на воротах, обращённых вправо-вниз (и наоборот).
editor_group: Перемещение накладок в игре
editor_group_descr: Выберите здание и щёлкните накладку на его панели. Выровняйте её стрелками и шагом смещения. Кнопка сохранения записывает смещения в локальную папку UCP.
editor_enabled: Показывать инструмент накладок на панели здания
editor_enabled_tooltip: "Показывает накладки выбранного здания на его панели: стрелки двигают их, а Save сохраняет их позиции."
mouse_group: Отображение войск на башнях, воротах и цитаделях
mouse_group_descr: Обычно накладка здания скрывается, пока на нём стоят войска.
hover_only: Скрывать накладки только при наведении мыши на здание
hover_only_tooltip: |-
  Башни, ворота и цитадели сохраняют отрисовку стен и зубцов даже с войсками наверху, чтобы бойцы стояли за зубцами. Наведите курсор на здание, чтобы увидеть, кто наверху. Охватывает накладки этого модуля и крыши игровых башен; зубцы башен и прочие игровые накладки сохраняют правила игры.
drawing_group: Отрисовка
drawing_group_descr: Способ отображения накладок на карте.
tile_by_tile: Здания спереди перекрывают накладки
tile_by_tile_tooltip: |-
  Игра рисует накладки целиком в переднем углу здания, из-за чего они просвечивают сквозь стоящие вплотную башни и стены. С этой опцией изображения модуля рисуются узкими полосами вместе с клетками здания, и всё стоящее впереди корректно их перекрывает. То же касается родных накладок игры на каждом здании (флаги, анимации, крыши башен…).
hide_units: Скрывать юнитов под крышами
hide_units_tooltip: Войска на башне, воротах или цитадели не отрисовываются, пока показана крыша, чтобы их части не торчали сквозь неё. Юниты, проходящие сквозь ворота, остаются видимыми. Требует включения «Здания спереди перекрывают накладки».
flags_on_top: Показывать флаги поверх накладок
flags_on_top_tooltip: Флаги на цитадели или другом здании рисуются сразу после его накладок, чтобы собственная накладка здания не закрывала их. Стены и здания спереди по-прежнему перекрывают флаг. Требует включения «Здания спереди перекрывают накладки».
back_flag_behind: Оставлять задний флаг позади здания
back_flag_behind_tooltip: Флаг на дальнем углу здания остаётся позади здания и юнитов на нём, где его рисует игра, а не поверх накладок. Требует включения «Показывать флаги поверх накладок».
keep_entrance_group: Вход в цитадель
keep_entrance_group_descr: Исправляет графическую ошибку игры у входа перед цитаделью.
keep_entrance_enabled: Правильно отрисовывать середину входа цитадели
keep_entrance_enabled_tooltip: При двух из четырёх поворотов карты игра рисует середину входа цитадели с неверным освещением — светлая колонна между затемнёнными башнями или тёмная в светлой арке. С этой опцией середина совпадает с соседними башнями. Вступает в силу через мгновение или при повороте карты.
flags_group: Флаги
flags_group_descr: Исправляет расположение флагов на зданиях.
flags_follow_turn: Сохранять позицию флагов при повороте карты
flags_follow_turn_tooltip: Игра вычисляет положение флагштока на экране лишь при установке флага для текущего ракурса. После поворота карты флагштоки смещаются на несколько пикселей от края здания. С этой опцией они корректно поворачиваются вместе с картой.
flags_on_edges: Смещать флаги к краю здания
flags_on_edges_tooltip: Игра ставит флаг по центру клетки, поэтому флаг на углу здания отступает на полклетки внутрь. С этой опцией флагшток сдвигается к самому краю (на угол в угловой клетке) в любом ракурсе.
qol: Удобство игры
bugfixes: Исправления
misc: Разное
