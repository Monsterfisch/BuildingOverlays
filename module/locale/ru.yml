large_gatehouse_group: Большие ворота
large_gatehouse_group_descr: Пока на барбакане никого нет, сверху отображается крыша.
large_gatehouse_enabled: Крыша на пустых больших барбаканах
large_gatehouse_enabled_tooltip: Крыша исчезает, когда на барбакан заходят войска.
large_gatehouse_swap_sides: Поменять местами левую и правую накладки
large_gatehouse_swap_sides_tooltip: Включите, если накладка для ворот, обращённых влево-вниз, показывается на воротах, обращённых вправо-вниз (и наоборот).
editor_group: Инструмент накладок
editor_group_descr: Выберите здание и нажмите на накладку на его панели. Настройте её стрелками и кнопкой шага, затем нажмите «Сохранить».
editor_enabled: Редактировать накладки на панели здания
editor_enabled_tooltip: Нажмите на накладку на панели выбранного здания, чтобы изменить её.
mouse_group: Отображение накладок
mouse_group_descr: Настройте, когда видны войска под накладками и где стоят флаги.
hover_only: Показывать войска при наведении
hover_only_tooltip: Наведите курсор на башню, барбакан или цитадель, чтобы увидеть войска за накладкой.
drawing_group: Отрисовка накладок
drawing_group_descr: Управляет отрисовкой накладок, войск и флагов.
tile_by_tile: Отрисовывать накладки за зданиями на переднем плане
tile_by_tile_tooltip: Стены и здания на переднем плане могут перекрывать накладки за ними.
hide_units: Скрывать войска под крышами
hide_units_tooltip: Войска под крышами скрыты. Юниты, проходящие через ворота, остаются видны.
flags_on_top: Показывать флаги поверх накладок
flags_on_top_tooltip: Флаги на цитадели или другом здании рисуются сразу после его накладок, чтобы собственная накладка здания не закрывала их. Стены и здания спереди по-прежнему перекрывают флаг. Требует включения «Здания спереди перекрывают накладки».
back_flag_behind: Оставлять задний флаг позади здания
back_flag_behind_tooltip: Флаг на дальнем углу здания остаётся позади здания и юнитов на нём, где его рисует игра, а не поверх накладок. Требует включения «Показывать флаги поверх накладок».
keep_entrance_group: Вход в цитадель
keep_entrance_group_descr: Исправляет несовпадение оттенка у входа в цитадель.
keep_entrance_enabled: Выровнять оттенок входа в цитадель
keep_entrance_enabled_tooltip: Центр входа в цитадель использует тот же оттенок, что и башни по бокам.
flags_group: Флаги
flags_group_descr: Выравнивает флаги по зданиям.
flags_follow_turn: Сохранять выравнивание флагов при повороте карты
flags_follow_turn_tooltip: Флаги остаются на своих местах при повороте карты.
flags_on_edges: Размещать флаги на краях зданий
flags_on_edges_tooltip: Флагштоки переносятся из центра клетки на край здания.
qol: Удобство игры
bugfixes: Исправления ошибок
